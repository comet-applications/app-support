<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Folire privacy policy has moved</title>
  <link rel="canonical" href="https://folire.app/privacy/">
  <meta http-equiv="refresh" content="0; url=https://folire.app/privacy/">
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.6; }
    body { margin: 0; display: grid; min-height: 100vh; place-items: center; padding: 24px; background: #f5f0e8; color: #1d1714; text-align: center; }
    a { color: #b83c20; font-weight: 650; }
    @media (prefers-color-scheme: dark) { body { background: #1d1714; color: #f5f0e8; } a { color: #ff9a77; } }
  </style>
  <script>location.replace("https://folire.app/privacy/" + location.hash);</script>
</head>
<body>
  <main>
    <p>The Folire privacy policy has moved to <a href="https://folire.app/privacy/">folire.app/privacy/</a>.</p>
  </main>
